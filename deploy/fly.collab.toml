# Hocuspocus collaboration server on Fly.io: at least two machines, no sticky
# sessions. Fly's proxy spreads WebSocket connections across machines and Redis
# keeps every machine's copy of a board converged (see README "Scaling").
#   fly deploy --config deploy/fly.collab.toml --dockerfile Dockerfile
#   fly scale count 2 --config deploy/fly.collab.toml
#   fly secrets set --config deploy/fly.collab.toml JWT_SECRET=... DATABASE_URL=... \
#     REDIS_URL=... METRICS_TOKEN=... [SENTRY_DSN=...]
# JWT_SECRET, DATABASE_URL and REDIS_URL must match the API's.
app = "huddle-collab"
primary_region = "iad"

[build.args]
  APP = "collab"

[env]
  NODE_ENV = "production"
  PORT = "1234"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 1234
  force_https = true
  # Stopping a machine drops its sockets; clients reconnect with backoff, but
  # keep both machines up so a scale-down never looks like an outage.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 1500

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    timeout = "2s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
