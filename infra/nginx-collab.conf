# Plain round-robin across collab nodes. Deliberately no ip_hash / sticky
# sessions: two users on the same board usually land on different nodes, and
# Redis pub/sub is what keeps their documents converged.
upstream collab {
  server collab-1:1234;
  server collab-2:1234;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 1234;

  location / {
    proxy_pass http://collab;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    # Long-lived sockets; the protocol has its own keepalive.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
