# Serves the SPA and reverse-proxies /api and /collab so the browser sees one
# origin (same as the Vite dev proxy and the Vercel rewrites in production).
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    # Server-Sent Events (AI streaming) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location /collab {
    rewrite ^/collab/?(.*)$ /$1 break;
    proxy_pass http://collab-lb:1234;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
